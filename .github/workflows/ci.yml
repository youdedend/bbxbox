name: ci

on:
  push:
    branches: ["arena/**", "main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: portable core + tests (2 min)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: sudo apt-get update && sudo apt-get install -y g++ cmake ninja-build ccache
      - name: compiler cache -- restore
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-host-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-host-${{ runner.os }}-
      - name: host build + unit tests + precheck
        run: ./tools/local_precheck.sh
      - name: compiler cache -- save
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-host-${{ runner.os }}-${{ github.sha }}

  console:
    name: UWP build + import audit
    runs-on: windows-2025
    env:
      # ccache would otherwise keep its cache under %LOCALAPPDATA%, outside the
      # path the cache steps above save and restore.
      CCACHE_DIR: ${{ github.workspace }}\.ccache
    steps:
      - uses: actions/checkout@v4
      - name: dependencies (SDL3-uwp, libuwp) -- cached
        id: deps
        uses: actions/cache@v4
        with:
          path: build-deps/prefix
          key: deps-${{ runner.os }}-${{ hashFiles('xbox/scripts/build-deps.ps1') }}
      - name: compiler cache -- restore
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}\.ccache
          key: ccache-console-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-console-${{ runner.os }}-
      - name: install ccache
        shell: pwsh
        run: |
          choco install ccache -y --no-progress
          $ccache = (Get-Command ccache -ErrorAction SilentlyContinue).Source
          if (-not $ccache) { Write-Output "::warning title=ccache missing::the build runs uncached"; exit 0 }
          & $ccache --version | Select-Object -First 1
          # The default config is 5 GiB of local disk; the runner has room, and a
          # link iteration should be a cache hit, not a rebuild.
          & $ccache --set-config=max_size=3G
          & $ccache --set-config=compiler_check=content
          Write-Output "::notice title=ccache::$ccache"
      - name: build dependencies when the cache misses
        if: steps.deps.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GITHUB_ACTIONS: "true"
        run: ./xbox/scripts/build-deps.ps1
      - name: ensure clang-cl (LLVM component)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath | Select-Object -First 1
          $clang = "$vs\VC\Tools\Llvm\x64\bin\clang-cl.exe"
          if (-not (Test-Path $clang)) {
            Write-Output "clang-cl missing; adding Microsoft.VisualStudio.Component.VC.Llvm.Clang"
            Start-Process -Wait -FilePath "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe" -ArgumentList `
              'modify', '--installPath', "`"$vs`"", '--add', 'Microsoft.VisualStudio.Component.VC.Llvm.Clang', '--quiet', '--norestart', '--nocache'
          }
          if (-not (Test-Path $clang)) { Write-Output "::error title=clang-cl missing::$clang"; exit 1 }
          & $clang --version | Select-Object -First 1

      - name: configure and build
        shell: pwsh
        env:
          GITHUB_ACTIONS: "true"
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          & ./xbox/scripts/build.ps1 2>&1 | Tee-Object -FilePath build/build-step.log
          if ($LASTEXITCODE -ne 0) {
            # Run logs are not always reachable after the fact; the annotation is.
            $lines = @(Get-Content build/build-step.log -ErrorAction SilentlyContinue)
            # Compiler and dxc diagnostics first: they are what explains the
            # failure, and they are not always inside the tail.
            $diagnostics = @($lines | Where-Object { $_ -match 'error[: ]|warning[: ]|FAILED:' } |
                Select-Object -Last 120)
            if ($diagnostics.Count -gt 0) {
                # Split into annotations of at most 3.5 KB: a message longer than
                # that is cut by the runner, and the eighth error in a file is
                # exactly what a link iteration is looking for. Eight as errors,
                # the rest as warnings (the runner keeps ten of each).
                $chunks = New-Object System.Collections.Generic.List[string]
                $current = New-Object System.Collections.Generic.List[string]
                $size = 0
                foreach ($line in $diagnostics) {
                    if ($size + $line.Length -gt 3500 -and $current.Count -gt 0) {
                        $chunks.Add(($current -join "`n")); $current.Clear(); $size = 0
                    }
                    $current.Add($line); $size += $line.Length + 1
                }
                if ($current.Count -gt 0) { $chunks.Add(($current -join "`n")) }
                for ($k = 0; $k -lt $chunks.Count; ++$k) {
                    $level = if ($k -lt 8) { 'error' } else { 'warning' }
                    $enc = $chunks[$k] -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
                    Write-Output "::$level title=diagnostics $($k + 1)/$($chunks.Count)::$enc"
                }
            } else {
                $tail = ($lines | Select-Object -Last 150) -join "`n"
                $enc = $tail -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
                Write-Output "::error title=build step failed::$enc"
            }
            exit 1
          }
      - name: which object still calls a refused import
        if: always()
        shell: bash
        # The import audit names the symbol, the link names nothing: this step
        # names where the reference is - an object in the build tree, a static
        # library member, or the line of the link map that took it - so a
        # refusal is fenced at its source instead of guessed at. `grep` rather
        # than `findstr`: objects are binary. Annotations, not stdout, because a
        # run's log is not always reachable afterwards.
        run: |
          set +e
          for sym in MapViewOfFile CreateFile2 FindFirstFileExW FindFirstFileW \
                     CreateDirectoryW MoveFileExW DeleteFileW CreateFileA CreateFileW; do
            stub="__imp_${sym}"
            hits=$(grep -rl --binary-files=text -F "$stub" build/xbox build-deps/prefix \
                     --include='*.obj' --include='*.lib' 2>/dev/null | head -12 | tr '\n' ' ')
            [ -n "$hits" ] && echo "::warning title=stub $sym::${hits//%/%25}"
            map=$(grep -n -F "$sym" build/xbox/bbxbox.map 2>/dev/null | head -6 | tr '\n' ' ')
            [ -n "$map" ] && echo "::warning title=map $sym::${map//%/%25}"
          done
          exit 0
      - name: package + check imports
        shell: pwsh
        env:
          GITHUB_ACTIONS: "true"
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          & ./xbox/scripts/package.ps1 2>&1 | Tee-Object -FilePath build/package-step.log
          if ($LASTEXITCODE -ne 0) {
            # A parse error in the script itself never reaches its own annotation.
            $tail = (Get-Content build/package-step.log -Tail 150 -ErrorAction SilentlyContinue) -join "`n"
            $enc = $tail -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Output "::error title=package step failed::$enc"
            exit 1
          }
      - name: compiler cache -- save
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}\.ccache
          key: ccache-console-${{ runner.os }}-${{ github.sha }}
      - name: upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/*.log
            build-deps/*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: bbxbox-appx
          path: |
            build/appx/*.appx
            build/appx/*.cer
            build/appx/Dependencies/*.appx
            build/xbox/**/bbxbox.map
            build/xbox/**/bbxbox.pdb
          if-no-files-found: error
